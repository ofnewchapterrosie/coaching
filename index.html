<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Takt</title>
<meta name="theme-color" content="#E6E8E5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Takt">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E8E5; --card:#FBFBF9; --ink:#14202B; --ink2:#44505B; --mute:#75808A; --line:#D6DAD7; --soft:#EEF0ED;
  --paper:#FFFFFF; --paper-ink:#14202B; --paper-line:#D6DAD7;
  --good:#0CA30C; --good-t:#0A6E0A; --warn:#FAB219; --warn-t:#7A5200; --crit:#D03B3B; --crit-t:#B02A2A;
  --s1:#2A78D6; --s2:#EB6834; --s3:#6250D6;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1418; --card:#182028; --ink:#E9EDF0; --ink2:#B6C0C9; --mute:#84909B; --line:#2B3541; --soft:#202A34;
  --paper:#F3F4F1; --paper-ink:#14202B; --paper-line:#F3F4F1;
  --good-t:#3CCB3C; --warn-t:#FAB219; --crit-t:#F07070;
  --s1:#3987E5; --s2:#D95926; --s3:#9085E9; color-scheme:dark;
}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:baseline;justify-content:space-between;padding:18px 0 10px}
.mark{font:700 30px/1 var(--cond);letter-spacing:.01em}
.mark i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ink);margin-left:3px;transform:translateY(-1px)}
.top .r{display:flex;gap:14px;align-items:center;color:var(--mute);font-size:13.5px}
.linkbtn{background:none;border:none;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:6px 0}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:12px}
.card h2{font:600 15px/1.3 var(--body);color:var(--ink2);margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h2 small{font-weight:400;color:var(--mute);font-size:13px}
.mute{color:var(--mute)}.sm{font-size:13.5px}
.offline{background:var(--warn);color:#14202B;border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:10px}

/* Startnummer */
.bib{position:relative;background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;margin:4px 0 14px;text-align:center;overflow:hidden}
.bib .hole{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.bib .hole:nth-child(1){top:11px;left:11px}.bib .hole:nth-child(2){top:11px;right:11px}
.bib .hole:nth-child(3){bottom:11px;left:11px}.bib .hole:nth-child(4){bottom:11px;right:11px}
.bib-date{padding:13px 34px 0;font:500 14px/1.3 var(--body);color:#44505B}
.bib-num{font:700 132px/.92 var(--cond);letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:4px 0 0}
.bib-cap{font-size:13px;color:#75808A;margin:-2px 0 12px}
.bib-band{font:700 30px/1 var(--cond);padding:11px 34px 12px;background:#C9CECB;color:#14202B;letter-spacing:.02em}
.bib.go .bib-band{background:var(--good);color:#fff}
.bib.dose .bib-band{background:var(--warn);color:#14202B}
.bib.spare .bib-band{background:var(--crit);color:#fff}
.why{list-style:none;margin:0 2px 14px;font-size:14.5px;color:var(--ink2)}
.why li{padding:3px 0 3px 16px;position:relative}
.why li::before{content:'';position:absolute;left:2px;top:12px;width:6px;height:2px;background:var(--mute)}

/* Werte-Streifen */
.vals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.val b{display:block;font:700 26px/1.1 var(--cond);font-variant-numeric:tabular-nums}
.val span{font-size:12.5px;color:var(--mute)}

/* Formulare */
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label,.flabel{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.f input,.f textarea,.f select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:17px}
.f input.big{font:700 26px/1.1 var(--cond);font-variant-numeric:tabular-nums;padding:9px 12px}
.f textarea{font-size:15px;min-height:64px;resize:vertical}
.f-row{margin-top:12px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:none;border:none;padding:11px 6px;font-size:14.5px;font-weight:500;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg button.ok[aria-pressed="true"]{background:var(--good);color:#fff}
.seg button.fail[aria-pressed="true"]{background:var(--warn);color:#14202B}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:12px 16px;font-weight:600;font-size:15px;border:1px solid var(--line);background:none}
.btn.pri{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
details.more>summary{list-style:none;cursor:pointer;color:var(--ink2);font-size:14px;padding:10px 0;display:flex;align-items:center;gap:8px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'';width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.more[open]>summary::before{transform:rotate(45deg)}

/* Einheit */
.s-kind{color:var(--mute);font-size:14px}
.s-rx{font:700 34px/1.08 var(--cond);margin:2px 0 6px;overflow-wrap:anywhere}
.s-meta{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:13.5px;color:var(--ink2)}
.s-note{margin-top:8px;font-size:13.5px;color:var(--mute);line-height:1.45}
.s-note.fb{color:var(--warn-t);padding-left:10px;border-left:2px solid var(--warn)}
.steps{margin-top:14px;border-top:1px solid var(--line)}
.step{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.5}
.step .k{color:var(--mute)}.step.solo{display:block}
.steps details.more>summary{border-bottom:1px solid var(--line)}
.steps details.more:not([open])>summary{border-bottom:none}
.sugg{margin-top:14px;background:var(--soft);border-radius:12px;padding:14px}
.sugg b{display:block;font-weight:600;margin-bottom:2px}
.sugg p{font-size:14px;color:var(--ink2);margin-bottom:12px}
.foot{display:flex;gap:10px;margin-top:14px}
.foot .seg{flex:1;max-width:380px}
.foot .btn{margin-left:auto}
.fb-rows{list-style:none;margin:10px 0 12px;border-top:1px solid var(--line)}
.fb-rows li{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.4;font-variant-numeric:tabular-nums}
.fb-rows .d,.fb-rows s{color:var(--mute)}
.done{display:flex;gap:10px;align-items:baseline;padding:10px 0 0;font-size:14px;color:var(--ink2)}
.tone{flex:none;width:9px;height:9px;border-radius:50%;background:var(--mute);transform:translateY(-1px)}
.tone.good{background:var(--good)}.tone.warn{background:var(--warn)}.tone.crit{background:var(--crit)}
.gtag{display:flex;align-items:baseline;gap:8px;font-size:13px!important;font-weight:600;color:var(--ink)!important}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.meal{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.meal .t{color:var(--mute);font-variant-numeric:tabular-nums}

/* Plan */
.wknav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.wknav b{font:700 24px/1 var(--cond)}
.wknav span{display:block;font-size:13px;color:var(--mute)}
.wknav .nav{display:flex;gap:6px}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1}
.days{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:12px}
.dayrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:13px 16px}
.dayrow:last-child{border-bottom:none}
.dayrow.today{background:var(--soft)}
.dayrow .dt b{display:block;font:700 22px/1 var(--cond)}
.dayrow .dt span{font-size:12.5px;color:var(--mute)}
.dayrow .tx b{display:block;font-weight:600;font-size:15.5px;line-height:1.3}
.dayrow .tx span{font-size:13px;color:var(--mute)}
.dayrow.rest .tx b{font-weight:400;color:var(--mute)}
.st{font-size:12.5px;white-space:nowrap;color:var(--mute);display:flex;align-items:center;gap:6px}
.st i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--mute)}
.st.ok i{background:var(--good);border-color:var(--good)}
.st.fail i{background:var(--warn);border-color:var(--warn)}
.st.miss i{background:none;border-color:var(--crit)}
.sumline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* Verlauf */
.goal{padding:12px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:none;padding-top:0}
.goal .gh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.goal .gh b{font-weight:600}
.goal .gh span{font-size:13px;color:var(--mute);white-space:nowrap}
.goal p{font-size:14px;color:var(--ink2);margin-top:3px}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font:400 11px var(--body);fill:var(--mute);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend i.dot{width:8px;height:8px;border-radius:50%}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.45;white-space:nowrap;z-index:5;transform:translate(-50%,-100%);font-variant-numeric:tabular-nums}
.tip b{font-weight:600}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.tbl th,table.tbl td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--line)}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl th{font-weight:500;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.wo{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.wo:first-of-type{border-top:none}
.wo .d{color:var(--mute);font-variant-numeric:tabular-nums}
.wo b{font-weight:600}
.wo p{color:var(--ink2);font-size:13.5px;display:flex;gap:8px;align-items:baseline}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14.5px}
.kv dt{color:var(--ink2)}.kv dd{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.rules{font-size:14.5px;color:var(--ink2);padding-left:18px}
.rules li{margin-bottom:6px}

/* Navigation, Sheet, Toast */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav.tabs button{flex:1;max-width:170px;background:none;border:none;padding:13px 4px 14px;font-weight:500;font-size:14.5px;color:var(--mute);position:relative}
nav.tabs button.on{color:var(--ink);font-weight:600}
nav.tabs button.on::before{content:'';position:absolute;top:-1px;left:30%;right:30%;height:3px;background:var(--ink);border-radius:0 0 3px 3px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,22,.5);z-index:40;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .2s ease-out,visibility 0s .2s}
.sheet.on{transform:none;visibility:visible;transition:transform .2s ease-out}
.sheet .in{max-width:640px;margin:0 auto}
.sheet h3{font:700 26px/1.1 var(--cond);margin-bottom:4px}
.sheet .sub{color:var(--mute);font-size:14px;margin-bottom:14px}
.pick{display:block;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--line);padding:12px 0;font-size:15px}
.pick span{color:var(--mute);font-size:13px;display:block}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1}
.empty{color:var(--mute);font-size:14.5px;padding:6px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:560px){.bib-num{font-size:150px}.s-rx{font-size:40px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark">Takt<i></i></div>
    <div class="r"><span id="stamp"></span><button class="linkbtn" onclick="reload()">Aktualisieren</button></div>
  </header>
  <div id="offline"></div>
  <section class="view on" id="v-heute"><div class="empty">Lade Daten …</div></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-verlauf"></section>
  <section class="view" id="v-mehr"></section>
</div>
<nav class="tabs" aria-label="Bereiche">
  <button class="on" data-v="heute" onclick="go('heute')">Heute</button>
  <button data-v="plan" onclick="go('plan')">Plan</button>
  <button data-v="verlauf" onclick="go('verlauf')">Verlauf</button>
  <button data-v="mehr" onclick="go('mehr')">Mehr</button>
</nav>
<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>
<div id="toast" role="status"></div>
<script>
/* ================================================================
   TAKT — Regel-Engine (reine Funktionen, kein Netz, keine KI)
================================================================ */
const T = {};

/* ---------- Datum ---------- */
T.iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
T.date = s => new Date(s + 'T12:00:00');
T.add = (s, n) => { const d = T.date(s); d.setDate(d.getDate() + n); return T.iso(d); };
T.diff = (a, b) => Math.round((T.date(a) - T.date(b)) / 86400000);
T.DOW = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
T.DOWL = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
T.MON = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
T.day = s => `${T.DOW[T.date(s).getDay()]} ${s.slice(8)}.${s.slice(5, 7)}.`;
T.dayY = s => `${+s.slice(8)}.${+s.slice(5, 7)}.${s.slice(0, 4)}`;
T.dayLong = s => `${T.DOWL[T.date(s).getDay()]}, ${+s.slice(8)}. ${T.MON[+s.slice(5, 7) - 1]}`;
T.monday = s => T.add(s, -((T.date(s).getDay() + 6) % 7));
T.mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
T.num = (v, n = 1) => v == null || isNaN(v) ? '–' : (+v).toFixed(n).replace('.', ',');
T.kg = v => String(Math.round(v / 2.5) * 2.5).replace('.', ',');
T.mmss = sec => { sec = Math.round(sec); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };

/* ---------- Check-in: Basiswerte und Readiness ---------- */
T.baseline = (checkins, date) => {
  const win = n => checkins.filter(c => c.checkin_date < date && c.checkin_date >= T.add(date, -n));
  const m = (rows, f) => T.mean(rows.map(c => c[f]).filter(v => v != null));
  return {
    hrv7: m(win(7), 'hrv_ms'), hrv28: m(win(28), 'hrv_ms'), hrv90: m(win(90), 'hrv_ms'),
    rhr7: m(win(7), 'resting_hr'), n: win(28).length
  };
};
/* Formel an 149 Check-ins kalibriert (82 % gleiche Stufe, Ø 6 Punkte Abweichung):
   70 + 1,5·(HRV − Langzeitmittel) + 0,5·(HRV − Ø28) − 2·(RHR − Ø7) + 2·(Schlaf − 7, gedeckelt bei 7,5 h) */
T.readiness = (ci, b) => {
  if (!ci || ci.hrv_ms == null) return null;
  const long = b.hrv90 ?? b.hrv28 ?? 38, h28 = b.hrv28 ?? long, r7 = b.rhr7 ?? ci.resting_hr ?? 58;
  const parts = [
    { k: 'HRV zum Langzeitmittel', v: 1.5 * (ci.hrv_ms - long) },
    { k: 'HRV zu den letzten 4 Wochen', v: 0.5 * (ci.hrv_ms - h28) },
    { k: 'Ruhepuls zur Vorwoche', v: ci.resting_hr != null ? -2 * (ci.resting_hr - r7) : 0 },
    { k: 'Schlaf', v: ci.sleep_hours != null ? 2 * (Math.min(ci.sleep_hours, 7.5) - 7) : 0 }
  ];
  const score = Math.round(Math.max(5, Math.min(99, 70 + parts.reduce((s, p) => s + p.v, 0))));
  return { score, label: score >= 70 ? 'GUT' : score >= 55 ? 'MODERAT' : 'SCHLECHT', parts };
};
T.achilles = v => { v = (v || '').toLowerCase(); return /rot|red|zieh|schmerz/.test(v) ? 'red' : /gelb|yellow|steif/.test(v) ? 'yellow' : v ? 'green' : null; };

/* ---------- Plan-Einheit lesen ---------- */
T.liftOf = t => /Kraft( Tag)? B|Bank/i.test(t || '') ? 'Bank' : /Kraft( Tag)? A|Kreuzheb/i.test(t || '') ? 'Kreuzheben' : null;
T.classify = row => {
  const t = (row && row.main_text) || '';
  const c = { kind: 'other', level: 'easy', test: false, interval: false, long: false, lift: null };
  if (/^\s*(ruhetag|ruhe\b|pause|frei)/i.test(t)) { c.kind = 'rest'; c.level = 'rest'; return c; }
  if (/kraft|bankdr|kreuzheb/i.test(t)) {
    c.kind = 'strength'; c.lift = T.liftOf(t); c.test = /test|single/i.test(t); c.level = c.test ? 'hard' : 'moderate'; return c;
  }
  if (/lauf|longrun|\brun\b|sportabzeichen|jogg/i.test(t)) {
    c.kind = 'run'; c.interval = /intervall|\d\s*[×x]\s*\d/i.test(t); c.long = /longrun|lang/i.test(t);
    c.test = /test|wettkampf|rennen|sportabzeichen/i.test(t);
    c.level = c.interval || c.test || /tempo|schwelle/i.test(t) ? 'hard' : c.long ? 'moderate' : 'easy'; return c;
  }
  if (/rad|zwift|ride|ausfahrt|rolle/i.test(t)) {
    c.kind = 'ride'; c.level = /hart|[×x]\s*\d|vo2|sst|sweet|race|rennen|intervall/i.test(t) ? 'hard' : 'easy'; return c;
  }
  return c;
};
T.KIND = { run: 'Lauf', ride: 'Rad', strength: 'Kraft', rest: 'Ruhe', other: 'Einheit' };
T.sportTypes = c => ({ run: ['run'], ride: ['virtualride'], strength: ['weighttraining', 'ride'], rest: ['rest'], other: ['other'] })[c.kind];
T.splitMain = t => {
  const m = (t || '').match(/^(.+?)(?:\s·\s|:\s)(.+)$/);
  const kind = m ? m[1] : '', rest = m ? m[2] : (t || '');
  const [rx, ...extra] = rest.split(' + ');
  return { kind, rx, extra: extra.join(' + ') };
};
T.steps = txt => (txt || '').split(' // ').map(s => s.trim()).filter(Boolean).map(s => {
  const m = s.match(/^([A-ZÄÖÜ]{3,}):\s*([\s\S]*)$/);
  return m ? { key: m[1], k: m[1][0] + m[1].slice(1).toLowerCase(), v: m[2].trim() } : { key: '', k: '', v: s };
});

/* ---------- Belastung (CTL/ATL/TSB) aus den Einheiten ---------- */
T.wKind = w => /run/i.test(w.sport) ? 'run' : /ebike/i.test(w.sport) ? 'ebike' : /ride|cycl/i.test(w.sport) ? 'ride' : /weight|strength/i.test(w.sport) ? 'strength' : 'other';
T.load = (workouts, today) => {
  const by = {};
  workouts.forEach(w => { if (T.wKind(w) !== 'ebike') by[w.workout_date] = (by[w.workout_date] || 0) + (w.tss || 0); });
  const dates = Object.keys(by).sort();
  if (!dates.length) return [];
  const out = []; let ctl = 0, atl = 0;
  const kc = 1 - Math.exp(-1 / 42), ka = 1 - Math.exp(-1 / 7);
  for (let d = dates[0]; d <= today; d = T.add(d, 1)) {
    const tss = by[d] || 0;
    const tsb = ctl - atl;                 // Form am Morgen, vor der Einheit
    ctl += (tss - ctl) * kc; atl += (tss - atl) * ka;
    out.push({ d, tss, ctl, atl, tsb });
  }
  return out;
};

/* ---------- Tagesurteil ---------- */
const ORDER = ['go', 'dose', 'spare'];
T.verdict = ctx => {
  const { ci, base, rd, cls, load, yesterdayHard, hrvFalling } = ctx, off = ctx.off || {};
  const why = [], caps = [];
  if (!rd) return { level: null, word: 'Offen', why: ['Noch kein Check-in für heute.'], action: 'none' };
  let level = rd.score >= 70 ? 'go' : rd.score >= 55 ? 'dose' : 'spare';
  const cap = (lv, text) => { caps.push(text); if (ORDER.indexOf(lv) > ORDER.indexOf(level)) level = lv; };
  const dh = base.hrv7 != null ? ci.hrv_ms - base.hrv7 : null;
  if (dh != null) why.push(`HRV ${ci.hrv_ms} ms, ${Math.abs(dh) < 1 ? 'auf dem Niveau der' : T.num(Math.abs(dh), 0) + (dh > 0 ? ' über der' : ' unter der')} Vorwoche (Ø ${T.num(base.hrv7, 0)})`);
  else why.push(`HRV ${ci.hrv_ms} ms`);
  if (ci.resting_hr != null && base.rhr7 != null) {
    const dr = ci.resting_hr - base.rhr7;
    if (dr >= 4.5 && !off.rhr) cap('dose', `Ruhepuls ${ci.resting_hr}, ${T.num(dr, 0)} Schläge über der Vorwoche: der Körper verarbeitet noch`);
    else why.push(`Ruhepuls ${ci.resting_hr} (Vorwoche Ø ${T.num(base.rhr7, 0)})`);
  }
  if (ci.sleep_hours != null) { if (ci.sleep_hours < 6 && !off.sleep) cap('dose', `Nur ${T.num(ci.sleep_hours)} h Schlaf`); else why.push(`${T.num(ci.sleep_hours)} h Schlaf`); }
  if (hrvFalling && !off.falling) cap('dose', 'HRV fällt den dritten Tag in Folge: heute keine Intensität');
  if (ci.energy != null && ci.energy <= 3) cap('dose', 'Du fühlst dich platt');
  const tsb = load && load.length ? load[load.length - 1].tsb : null;
  if (tsb != null && tsb < -20) cap('dose', `Form bei ${T.num(tsb, 0)}: viel Belastung in den Beinen`);
  if (yesterdayHard && cls.level === 'hard') cap('dose', 'Gestern war schon hart: keine zwei harten Tage hintereinander');
  const ach = T.achilles(ci.achilles);
  let action = 'planned', word = 'Los';
  if (cls.kind === 'rest') { action = 'planned'; word = 'Erholen'; }
  else if (ach === 'red' && cls.kind === 'run') { action = 'replace_ride'; word = 'Schonen'; caps.push('Achillessehne zieht: heute nicht laufen'); }
  else if (ach === 'yellow' && cls.kind === 'run' && cls.level !== 'easy') { action = 'replace_ride'; word = 'Schonen'; caps.push('Achillessehne steif: keine Lauf-Intensität'); }
  else if (level === 'dose') {
    if (cls.level === 'hard') { action = cls.test ? 'move' : 'dose'; word = 'Dosiert'; }
    else if (cls.kind === 'strength') { action = 'dose'; word = 'Dosiert'; }
    else { action = 'planned'; word = 'Los'; }
  } else if (level === 'spare') {
    if (cls.level === 'hard') { action = 'move'; word = 'Schonen'; }
    else if (cls.level === 'moderate') { action = 'dose'; word = 'Dosiert'; }
    else if (rd.score < 45) { action = 'rest'; word = 'Schonen'; }
    else { action = 'planned'; word = 'Locker'; }
  }
  if (ach === 'yellow' && cls.kind === 'run' && action === 'planned') caps.push('Achillessehne steif: flach laufen, bei Ziehen abbrechen');
  return { level, word, why: [...caps, ...why].slice(0, 4), action, tsb };
};

/* ---------- Einheit dosieren ---------- */
T.scaleKg = (txt, f) => f === 1 ? (txt || '') : (txt || '').replace(/@\s*(\d+(?:[.,]\d+)?)\s*kg/g, (m, w) => '@ ' + T.kg(parseFloat(w.replace(',', '.')) * f) + ' kg');
T.paceAdd = (txt, d) => {
  if (!d) return txt || '';
  const f = (mm, ss) => T.mmss(+mm * 60 + +ss + d);
  return (txt || '').replace(/@\s*(\d):(\d\d)(?:–(\d):(\d\d))?/g, (m, m1, s1, m2, s2) => '@ ' + f(m1, s1) + (m2 ? '–' + f(m2, s2) : ''));
};
T.repsAdd = (txt, d) => {
  if (!d) return txt || '';
  const n = x => Math.max(3, +x + d);
  return (txt || '').replace(/(\d+)(?:–(\d+))?×1 km/g, (m, a, b) => (b ? n(a) + '–' + n(b) : n(a)) + '×1 km');
};
T.kmScale = (txt, f) => (txt || '').replace(/(\d+)(?:–(\d+))?\s*km/g, (m, a, b) => { const r = x => Math.max(3, Math.round(+x * f)); return (b ? r(a) + '–' + r(b) : r(a)) + ' km'; });
T.dose = (row, cls, strong) => {
  const out = { main_text: row.main_text, detail_text: row.detail_text, duration_min: row.duration_min };
  if (cls.kind === 'strength') {
    const f = strong ? 0.9 : 0.95;
    out.main_text = T.scaleKg(row.main_text, f).replace(/TEST-TAG|Top-Single|Test(?= @)/i, 'Technik');
    out.detail_text = T.scaleKg(row.detail_text, f);
    out.note = `Gewichte ${strong ? '−10' : '−5'} %, kein Maximalversuch`;
  } else if (cls.kind === 'run' && cls.interval) {
    out.main_text = T.repsAdd(row.main_text, -1); out.detail_text = T.repsAdd(row.detail_text, -1);
    out.duration_min = row.duration_min ? row.duration_min - 6 : row.duration_min;
    out.note = 'Eine Wiederholung weniger, Pace bleibt';
  } else if (cls.kind === 'run' && cls.long) {
    out.main_text = T.kmScale(row.main_text, 0.75); out.detail_text = row.detail_text;
    out.duration_min = row.duration_min ? Math.round(row.duration_min * 0.75) : row.duration_min;
    out.note = 'Longrun um ein Viertel gekürzt';
  } else if (cls.kind === 'run') {
    out.main_text = 'Lauf locker: 30–40 min'; out.duration_min = 40;
    out.detail_text = 'LAUF: 30–40 min sehr locker, HF ≤148 bpm. // ACHILLES: flache Strecke, bei Ziehen gehen.';
    out.note = 'Statt hart nur locker';
  } else if (cls.kind === 'ride') {
    out.main_text = 'Rad Z2: 45 min locker'; out.duration_min = 45;
    out.detail_text = 'RAD: 45 min @ 170–200 W, HF 139–155 bpm. Keine Sprints.';
    out.note = 'Statt hart nur Z2';
  }
  return out;
};
T.RIDE_INSTEAD = { main_text: 'Rad Z2: 45–60 min statt Lauf', duration_min: 55, detail_text: 'RAD: 45–60 min @ 170–200 W, HF 139–155 bpm. // ACHILLES: heute kein Lauf, kein schweres Wadenheben. Morgen neu bewerten.' };
T.REST = { main_text: 'Ruhetag', duration_min: 0, detail_text: 'Kein Training. Spazieren und Mobilität sind in Ordnung.' };
/* nächster passender Tauschpartner: lockerer Tag oder Ruhetag in den nächsten 3 Tagen */
T.swapPartner = (plan, today) => plan.filter(p => p.plan_date > today && p.plan_date <= T.add(today, 3))
  .find(p => ['rest', 'easy'].includes(T.classify(p).level)) || null;

/* ---------- Fallback bei verfehlter Einheit ---------- */
T.weekOf = r => { const m = ((r && r.coaching_rationale) || '').match(/Woche (\d+)\/(\d+)/); return m ? { w: +m[1], n: +m[2] } : null; };
T.isDeload = r => { const k = T.weekOf(r); return k ? (k.w % 4 === 0 && k.w < k.n) : /@\s*\d:\d\d–\d:\d\d/.test((r && r.main_text) || ''); };
T.Z2WEEK = { main_text: 'Lauf – Z2 locker 6 km + Strides (Intervall-Fallback)', duration_min: 50, detail_text: 'LAUF: 6 km sehr locker, HF ≤148 bpm, am Ende 4 Strides à 15 s. // ZIEL: Erholung statt Reiz. Schlaf, Verdauung und Sehne prüfen, bevor die Intervalle weitergehen.' };
T.sameChain = (a, cls) => { const c = T.classify(a); return cls.kind === 'strength' ? c.kind === 'strength' && c.lift === cls.lift : c.kind === 'run' && (c.interval || /Intervall/i.test(a.main_text)); };
T.fallback = (plan, p, today) => {
  const cls = T.classify(p);
  const chain = plan.filter(r => r.plan_date !== p.plan_date && T.sameChain(r, cls));
  const past = chain.filter(r => r.plan_date < today).reverse(), fut = chain.filter(r => r.plan_date > today);
  let streak = 1;
  for (const r of past) { if (r.result === 'fail') streak++; else break; }
  const strip = r => (r || '').split(' | ').filter(x => x && !/^Fallback/.test(x)).join(' | ');
  const rows = []; let label;
  const note = (src, l) => ({ coaching_rationale: `Fallback (${streak}× in Folge verfehlt, ${T.day(today)}): ${l}.` + (strip(src.coaching_rationale) ? ' | ' + strip(src.coaching_rationale) : ''), is_adjusted: true, adjustment_reason: 'Takt-Fallback' });
  if (cls.kind === 'run') {
    const dP = streak >= 3 ? 10 : streak === 2 ? 5 : 0, dR = streak >= 2 ? -1 : 0;
    const f8 = fut.slice(0, 8), bi = f8.findIndex(T.isDeload);
    const blockEnd = T.isDeload(p) ? 0 : (bi >= 0 ? bi : f8.length);
    label = streak >= 3 ? 'Eine Woche Z2, danach Pace +10 s/km und 1 Wiederholung weniger'
      : streak === 2 ? 'Wiederholen, Pace +5 s/km und 1 Wiederholung weniger'
      : blockEnd > 0 ? 'Wiederholen, die letzte Steigerung des Blocks entfällt'
      : 'Deload verfehlt. Der Plan bleibt, achte auf Erholung, Schlaf und Sehne';
    const seq = blockEnd > 0 ? (streak >= 3 ? [T.Z2WEEK, p] : [p]).concat(f8.slice(0, blockEnd)) : [];
    f8.forEach((r, i) => {
      const shifted = i < blockEnd, src = shifted ? seq[i] : r;
      if (!shifted && !dP && !dR) return;
      let body;
      if (src === T.Z2WEEK) body = { ...T.Z2WEEK };
      else {
        const dr = T.isDeload(src) ? 0 : dR;
        body = { main_text: T.repsAdd(T.paceAdd(src.main_text, dP), dr), detail_text: T.repsAdd(T.paceAdd(src.detail_text, dP), dr), duration_min: src.duration_min ? src.duration_min + Math.round(dr * 6.5) : src.duration_min };
      }
      rows.push({ plan_date: r.plan_date, old: r.main_text, body: { ...body, ...note(src, label) } });
    });
  } else {
    const f = streak >= 3 ? 0.9 : streak === 2 ? 0.95 : 1, f4 = fut.slice(0, 4), src = [p, ...f4];
    label = streak >= 3 ? 'Deload, alle Gewichte −10 %' : streak === 2 ? 'Wiederholen, alle Gewichte −5 %' : 'Wiederholen, der Zyklus rutscht eine Woche';
    f4.forEach((r, i) => rows.push({ plan_date: r.plan_date, old: r.main_text, body: { main_text: T.scaleKg(src[i].main_text, f), detail_text: T.scaleKg(src[i].detail_text, f), duration_min: src[i].duration_min, ...note(src[i], label) } }));
  }
  return { streak, label, rows, run: cls.kind === 'run' };
};

/* ---------- Kraftzyklus aus dem Max ---------- */
T.CYCLE = [
  { s: 4, r: 3, pct: 0.875, bo: [2, 6, 0.72], rpe: '7', pause: '3 min' },
  { s: 4, r: 2, pct: 0.925, bo: [2, 5, 0.76], rpe: '7–8', pause: '3–4 min' },
  { s: 3, r: 2, pct: 0.95, bo: [2, 4, 0.80], rpe: '8', pause: '4 min' },
  { test: true, pct: 1.025, pause: '4–5 min' }
];
T.cycle = (lift, max, rows) => rows.slice(0, 4).map((r, i) => {
  const w = T.CYCLE[i], top = T.kg(max * w.pct), bank = lift === 'Bank';
  const name = bank ? 'Kraft B (Bank)' : 'Kraft A (Kreuzheben)', tail = bank ? 'lockeres Rad' : 'Rad Z2';
  const warm = (bank ? [0.32, 0.48, 0.64, 0.78] : [0.33, 0.55, 0.7, 0.8]).map(p => T.kg(max * p)).join(' / ');
  const extra = bank
    ? 'ZUSATZ: Pendlay Row 4×6 · Schulterdrücken 3×8 · Trizeps 3×10 · Pallof Press 3×10/Seite. // DANACH: Calf Raises 3×12 (3 s absenken), dann lockeres Rad 30–40 min unter 165 W.'
    : 'ZUSATZ: RDL 3×8 · Split Squats 3×8/Bein · Wadenheben exzentrisch 3×12 (3 s absenken) · Plank 3×45–60 s. // DANACH: Rad Z2 60–75 min @ 190–210 W, HF 139–155.';
  const ex = bank ? 'Bankdrücken' : 'Trap-Bar-Kreuzheben';
  const body = w.test
    ? { main_text: `${name} · Test @ ${top} kg + ${tail}`, detail_text: `EINLAUFEN: Steigerungssätze ${warm} kg, dann Single @ ${T.kg(max * 0.92)} kg // HAUPTTEIL: ${ex} Top-Single @ ${top} kg (${Math.round(w.pct * 100)} % von ${T.kg(max)} kg). Nur bei Readiness ab 70 und schnellen Aufwärmsätzen, sonst 3×2 @ ${T.kg(max * 0.9)} kg. // PAUSE: ${w.pause} vor dem Single // ${extra}` }
    : { main_text: `${name} · ${w.s}×${w.r} @ ${top} kg + ${tail}`, detail_text: `EINLAUFEN: Steigerungssätze ${warm} kg // HAUPTTEIL: ${ex} ${w.s}×${w.r} @ ${top} kg (${T.num(w.pct * 100, 1)} % von ${T.kg(max)} kg) // PAUSE: ${w.pause} // BACKOFF: ${w.bo[0]}×${w.bo[1]} @ ${T.kg(max * w.bo[2])} kg (RPE ${w.rpe}), 2 min Pause. // ${extra}` };
  return { plan_date: r.plan_date, old: r.main_text, body: { ...body, duration_min: r.duration_min || (bank ? 90 : 120), coaching_rationale: `${bank ? 'Bank' : 'Kreuzheben'}-Zyklus Woche ${i + 1}/4, Anker ${T.kg(max)} kg.`, is_adjusted: true, adjustment_reason: 'Takt-Kraftzyklus', result: null } };
});

/* ---------- Einheit bewerten ---------- */
T.pace = w => w.distance_km > 0.5 && w.duration_min ? (w.duration_min * 60) / w.distance_km : null;
T.review = (w, cls) => {
  const k = T.wKind(w), hr = w.avg_hr;
  if (cls && cls.kind === 'rest' && (w.tss || 0) >= 40) return { tone: 'warn', text: 'Am Ruhetag trainiert. Achte morgen auf HRV und Ruhepuls.' };
  if (k === 'run') {
    const p = T.pace(w), ps = p ? `${T.mmss(p)}/km` : '';
    if (cls && cls.kind === 'run' && cls.level === 'easy' || (!cls || cls.kind !== 'run') && hr && hr < 150) {
      if (hr && hr <= 148) return { tone: 'good', text: `Locker gelaufen: Ø-Puls ${hr}, ${ps}. Passt zur Sehne.` };
      if (hr && hr <= 155) return { tone: 'info', text: `Ø-Puls ${hr}, etwas über locker (Grenze 148).` };
      if (hr) return { tone: 'warn', text: `Ø-Puls ${hr}: für einen lockeren Lauf zu hart.` };
    }
    if (cls && cls.interval) return { tone: 'info', text: `${T.num(w.distance_km)} km inkl. Ein- und Auslaufen, Max-Puls ${w.max_hr || '–'}.` };
    if (cls && cls.long) return { tone: hr && hr > 155 ? 'warn' : 'good', text: `${T.num(w.distance_km)} km in ${w.duration_min} min, Ø-Puls ${hr || '–'}${hr && hr > 155 ? ': zu hoch für einen Longrun' : ''}.` };
    return { tone: 'info', text: `${T.num(w.distance_km)} km, ${ps}, Ø-Puls ${hr || '–'}.` };
  }
  if (k === 'ride') {
    const planned = cls && cls.kind === 'ride', easy = planned && cls.level === 'easy';
    if (easy && hr && hr > 155) return { tone: 'warn', text: `Ø-Puls ${hr}: über Z2 (139–155). Geplant war locker.` };
    return { tone: easy ? 'good' : 'info', text: `${w.duration_min} min${w.avg_watts ? ', Ø ' + Math.round(w.avg_watts) + ' W' : ''}${hr ? ', Ø-Puls ' + hr : ''}.` };
  }
  if (k === 'strength') return { tone: 'info', text: `${w.duration_min} min Kraft${hr ? ', Ø-Puls ' + hr : ''}.` };
  return { tone: 'info', text: `${w.duration_min || '–'} min.` };
};
T.matches = (w, cls) => { const k = T.wKind(w); return cls.kind === k || (cls.kind === 'strength' && k === 'ride') || cls.kind === 'other'; };

/* ---------- Gewicht ---------- */
T.weight = (checkins, today, target, targetDate) => {
  const pts = checkins.filter(c => c.weight_kg != null && c.checkin_date >= T.add(today, -21)).map(c => ({ x: T.diff(c.checkin_date, today), y: +c.weight_kg }));
  const last7 = pts.filter(p => p.x > -7).map(p => p.y);
  if (pts.length < 4 || !last7.length) return null;
  const mx = T.mean(pts.map(p => p.x)), my = T.mean(pts.map(p => p.y));
  const sxx = pts.reduce((s, p) => s + (p.x - mx) ** 2, 0);
  const slope = sxx ? pts.reduce((s, p) => s + (p.x - mx) * (p.y - my), 0) / sxx : 0;
  const now = T.mean(last7), out = { now, perWeek: slope * 7, kcalDay: Math.round(-slope * 7700), n: pts.length };
  if (target && targetDate) {
    const days = T.diff(targetDate, today);
    out.target = target; out.targetDate = targetDate; out.days = days;
    out.projected = now + slope * days;
    out.needPerWeek = days > 0 ? (target - now) / (days / 7) : null;
    out.eta = slope < -0.005 ? T.add(today, Math.round((target - now) / slope)) : null;
  }
  return out;
};

/* ---------- Lauf: VDOT nach Daniels ---------- */
T.vo2 = v => -4.6 + 0.182258 * v + 0.000104 * v * v;
T.pct = t => 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t);
T.vdot = (km, sec) => { const t = sec / 60; return T.vo2(km * 1000 / t) / T.pct(t); };
T.raceTime = (vdot, km) => { let lo = 60, hi = 36000; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (T.vdot(km, m) > vdot) lo = m; else hi = m; } return (lo + hi) / 2; };
T.vAt = vo2 => (-0.182258 + Math.sqrt(0.182258 ** 2 + 4 * 0.000104 * (vo2 + 4.6))) / (2 * 0.000104);
T.paceAt = (vdot, frac) => 60000 / T.vAt(vdot * frac);   // Sekunden pro km
T.paces = vdot => ({ easy: [T.paceAt(vdot, 0.74), T.paceAt(vdot, 0.62)], threshold: T.paceAt(vdot, 0.88), interval: T.paceAt(vdot, 0.975) });


/* ---------- Runden auswerten ---------- */
T.target = text => {
  const m = (text || '').match(/(\d+)(?:–(\d+))?\s*[×x]\s*(\d+(?:[.,]\d+)?)\s*(km|m)\b[^@]*@\s*(\d):(\d\d)(?:–(\d):(\d\d))?/);
  if (!m) return null;
  const p1 = +m[5] * 60 + +m[6], p2 = m[7] ? +m[7] * 60 + +m[8] : p1;
  return { reps: +m[1], dist: parseFloat(m[3].replace(',', '.')) * (m[4] === 'km' ? 1000 : 1), pace: Math.max(p1, p2), paceFast: Math.min(p1, p2) };
};
T.reps = (w, tg) => {
  if (!w || !Array.isArray(w.laps) || w.laps.length < 3 || !tg) return null;      // ohne Runden nicht bewertbar
  const hit = w.laps.filter(l => l.d >= tg.dist * 0.92 && l.d <= tg.dist * 1.08 && l.t > 0 && l.t / l.d * 1000 <= tg.pace + 25);
  const paces = hit.map(l => l.t / l.d * 1000), avg = T.mean(paces), hrs = hit.map(l => l.hr).filter(Boolean);
  return { n: hit.length, planned: tg.reps, avg, target: tg.pace, hr: hrs.length ? Math.round(T.mean(hrs)) : null,
    ok: hit.length >= tg.reps && avg <= tg.pace + 3, fast: avg != null ? tg.paceFast - avg : 0 };
};
T.repsText = e => e.n ? `${e.n} von ${e.planned} Abschnitten, Ø ${T.mmss(e.avg)} (Ziel ${T.mmss(e.target)})${e.hr ? ', Ø-Puls ' + e.hr : ''}` : `Kein Abschnitt in Zielnähe gefunden (Ziel ${T.mmss(e.target)})`;
/* zweimal in Folge klar schneller bei ruhigem Puls → Pace anziehen */
T.paceUp = evals => {
  const last = evals.filter(e => e.ev).slice(-2);
  if (last.length < 2 || !last.every(e => e.ev.ok && e.ev.fast >= 6)) return null;
  const hr = Math.max(...last.map(e => e.ev.hr || 0));
  return { date: last[1].date, hr, calm: hr > 0 && hr <= 170, fast: Math.round(T.mean(last.map(e => e.ev.fast))) };
};

/* ---------- Ziele ehrlich prüfen ---------- */
T.GAIN = 0.15;   // Annahme: VDOT-Zuwachs pro Woche bei strukturiertem Training
T.goalWeight = (w, today) => {
  if (!w || w.target == null) return null;
  const need = w.needPerWeek, has = w.perWeek, left = w.target - w.now;
  if (left >= 0) return { state: 'ok', text: 'Ziel erreicht.' };
  if (w.days <= 0) return { state: 'off', text: `Termin vorbei, es fehlen ${T.num(-left)} kg.`, rate: has < -0.2 ? Math.max(has, -1) : -0.6 };
  if (has <= need * 0.9) return { state: 'ok', text: `Auf Kurs: du nimmst ${T.num(-has, 2)} kg pro Woche ab, nötig sind ${T.num(-need, 2)}.` };
  const rate = has < -0.2 ? Math.max(has, -1) : -0.6;
  const eta = T.add(today, Math.round(left / rate * 7));
  const steep = need < -1 ? ` Das wären rund ${Math.round(-need * 11) * 100} kcal Defizit pro Tag und kostet Leistung.` : '';
  return { state: need < -1 || has > need * 0.6 ? 'off' : 'tight', eta,
    text: `Zum Termin nicht erreichbar: nötig wären ${T.num(-need, 2)} kg Abnahme pro Woche, ${has > -0.05 ? 'dein Gewicht steht aber' : 'dein Trend liegt bei ' + T.num(-has, 2)}.${steep} Mit ${T.num(-rate, 2)} kg pro Woche bist du am ${T.dayY(eta)} dort.` };

T.goalRun = (vdot, km, goalSec, weeks, wNow, wThen) => {

  if (t <= goalSec) return { state: 'ok', now, t, text: `Erreichbar: heute ${T.mmss(now)}, zum Termin rechnerisch ${T.mmss(t)}.` };
  const weeksNeed = Math.ceil((need / wf - vdot) / T.GAIN);
  return { state: t <= goalSec * 1.04 ? 'tight' : 'off', now, t, stage, need,
    text: `${t <= goalSec * 1.04 ? 'Knapp' : 'Zum Termin nicht erreichbar'}: heute ${T.mmss(now)}, zum Termin rechnerisch ${T.mmss(t)} statt ${T.mmss(goalSec)}. Gerechnet mit +${T.num(T.GAIN, 2)} VDOT pro Woche und deinem Gewichtstrend; für ${T.mmss(goalSec)} wären es etwa ${weeksNeed} Wochen.` };

T.goalLift = (pr, target, today) => {

};

T.evidence = (ck, wo, plan) => {

  };

  const after = f => hrv.filter(c => f(T.add(c.checkin_date, -1), T.add(c.checkin_date, -2)));
  cmp('Harter Tag', after(y => (tss[y] || 0) >= 60), after(y => (tss[y] || 0) <= 15), 'Am Morgen nach hoher Belastung', 'nach Ruhe', 'Plane nach harten Tagen einen lockeren ein.');
  cmp('Zwei Belastungstage in Folge', after((y, yy) => (tss[y] || 0) >= 40 && (tss[yy] || 0) >= 40), after((y, yy) => (tss[y] || 0) < 40 && (tss[yy] || 0) < 40), 'Nach zwei Tagen in Folge', 'nach zwei ruhigeren Tagen', 'Zwei Tage in Folge kosten dich messbar Erholung.');

  if (lo.length >= 5 && hi.length >= 5) {

};

  if (a.weight != null && b.weight != null) { const d = a.weight - b.weight; lines.push(`Gewicht im Wochenschnitt ${T.num(a.weight)} kg, ${Math.abs(d) < 0.05 ? 'unverändert' : (d < 0 ? '−' : '+') + T.num(Math.abs(d)) + ' kg'} zur Vorwoche.`); }

const applyDose = () => { const d = T.dose(S.row, S.cls, S.v.level === 'spare'); adjust(S.today, d, `Dosiert bei Readiness ${S.rd.score}: ${d.note}`); };

async function swapDays(a, b) {
  const A = rowOn(a), B = rowOn(b); if (!A || !B) return toast('Für einen der Tage fehlt der Plan-Eintrag.');
  const F = ['main_text', 'detail_text', 'duration_min', 'hf_target_lo', 'hf_target_hi', 'coaching_rationale'];

  const ok = await patch('adaptive_plan', `plan_date=eq.${a}`, take(B, b)) && await patch('adaptive_plan', `plan_date=eq.${b}`, take(A, a));
  if (!saved(ok)) return;
  closeSheet(); toast(`${T.day(a)} und ${T.day(b)} getauscht`); refreshPlan();
}

function dayStatus(p, date) {
  if (!p) return null;
  const c = T.classify(p), done = wosOn(date).some(w => T.matches(w, c));
  if (p.result === 'fail') return ['fail', 'verfehlt'];
  if (!p.result && S.evals[date] && !S.evals[date].ok) return ['fail', 'prüfen'];
  if (date <= S.today && c.kind !== 'rest' && (done || p.result === 'ok')) return ['ok', 'erledigt'];
  if (date < S.today && c.kind !== 'rest') return ['miss', 'ausgelassen'];
  return null;
}

  const sum = k => wos.filter(w => T.wKind(w) === k);

  $('v-plan').innerHTML = `
    <div class="wknav"><div><b>Woche ${kw}</b><span>${d0.getDate()}. ${d0.getMonth() !== d6.getMonth() ? T.MON[d0.getMonth()] + ' ' : ''}bis ${d6.getDate()}. ${T.MON[d6.getMonth()]}</span></div>
      <div class="nav"><button class="icon-btn" aria-label="Vorige Woche" onclick="shiftWeek(-7)">‹</button>${mon !== T.monday(S.today) ? `<button class="btn" onclick="shiftWeek(0)">Heute</button>` : ''}<button class="icon-btn" aria-label="Nächste Woche" onclick="shiftWeek(7)">›</button></div></div>
    <div class="days">${days.map(d => {
      const p = rowOn(d), c = T.classify(p), st = dayStatus(p, d), sm = p ? T.splitMain(p.main_text) : null;

  const el = $(id); if (!el) return;
  const W = el.clientWidth || 340, H = 170, m = { l: 28, r: 6, t: 10, b: 22 }, n = cfg.groups.length;
  const tot = cfg.groups.map(g => g.vals.reduce((a, b) => a + b, 0)), max = Math.max(1, ...tot), step = niceStep(max / 3), hi = Math.ceil(max / step) * step;
  const bw = Math.min(24, (W - m.l - m.r) / n - 6), X = i => m.l + (i + 0.5) * (W - m.l - m.r) / n, Y = v => m.t + (hi - v) / hi * (H - m.t - m.b);
  let g = '';
  for (let v = 0; v <= hi + 1e-9; v += step) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${N(v, step < 1 ? 1 : 0)}</text>`;
  cfg.groups.forEach((gr, i) => {
    let acc = 0; const last = gr.vals.map((v, k) => v > 0 ? k : -1).filter(k => k >= 0).pop();
    gr.vals.forEach((v, k) => { if (v <= 0) return; const y1 = Y(acc + v), y0 = Y(acc), hgt = Math.max(1, y0 - y1 - (acc > 0 ? 2 : 0)), r = k === last ? Math.min(4, hgt / 2) : 0, x = X(i) - bw / 2;
      g += `<path d="M${x} ${y1 + hgt}V${y1 + r}a${r} ${r} 0 0 1 ${r} ${-r}h${bw - 2 * r}a${r} ${r} 0 0 1 ${r} ${r}V${y1 + hgt}z" fill="${cfg.series[k].color}"/>`; acc += v; });
    if (i % 2 === (n - 1) % 2) g += `<text x="${X(i)}" y="${H - 5}" text-anchor="middle">${gr.label}</text>`;
    g += `<rect class="hit" data-i="${i}" x="${X(i) - (W - m.l - m.r) / n / 2}" y="0" width="${(W - m.l - m.r) / n}" height="${H - m.b}" fill="transparent"/>`;
  });
  el.innerHTML = `${legendHtml(cfg.series)}<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Wochenumfang in Stunden">${g}</svg><div class="tip" hidden></div>
    <details class="more"><summary>Werte als Tabelle</summary><table class="tbl"><tr><th>Woche ab</th>${cfg.series.map(s => `<th>${s.name}</th>`).join('')}<th>Summe</th></tr>${cfg.groups.slice().reverse().map((gr, i) => `<tr><td>${gr.label}</td>${gr.vals.map(v => `<td>${N(v)}</td>`).join('')}<td>${N(tot[n - 1 - i])}</td></tr>`).join('')}</table></details>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  svg.querySelectorAll('.hit').forEach(h => {
    const show = () => { const i = +h.dataset.i, gr = cfg.groups[i], r = svg.getBoundingClientRect();
      tip.hidden = false; tip.innerHTML = `Woche ab ${gr.label}<br>${cfg.series.map((s, k) => `${s.name}: <b>${N(gr.vals[k])} ${cfg.unit}</b>`).join('<br>')}<br>Summe: <b>${N(tot[i])} ${cfg.unit}</b>`;
      const tw = tip.offsetWidth / 2, cx = X(i) / W * r.width; tip.style.left = Math.max(tw, Math.min(r.width - tw, cx)) + 'px'; tip.style.top = Math.max(tip.offsetHeight - 8, r.top - el.getBoundingClientRect().top + Y(tot[i]) - 6) + 'px'; };
    h.addEventListener('pointerenter', show); h.addEventListener('pointerdown', show);
  });
  svg.addEventListener('pointerleave', () => tip.hidden = true);
}
function openTest() {
  const last = [...S.wo].reverse().find(w => T.wKind(w) === 'run' && w.distance_km);
  sheet(`<h3>Testlauf eintragen</h3><div class="sub">Ein voll gelaufener Test oder Wettkampf über 3 bis 10 km. Daraus rechnet Takt deine Prognose und die Trainings-Paces.</div><div class="f">
    <div class="f-grid"><div><label for="tsKm">Strecke (km)</label><input class="big" id="tsKm" inputmode="decimal" value="${last ? String(Math.round(last.distance_km * 10) / 10).replace('.', ',') : '5'}"></div>
    <div><label for="tsT">Zeit (mm:ss)</label><input class="big" id="tsT" inputmode="numeric" placeholder="24:30"></div></div>
    <div class="f-row row"><button class="btn pri" onclick="saveTest()">Speichern</button><button class="btn" onclick="closeSheet()">Abbrechen</button></div></div>`);
}
async function saveTest() {
  const km = parseFloat($('tsKm').value.replace(',', '.')), m = $('tsT').value.trim().match(/^(\d{1,3})[:.,](\d{2})$/);
  if (!km || !m) return toast('Bitte Strecke und Zeit als mm:ss eintragen.');
  const sec = +m[1] * 60 + +m[2], vd = Math.round(T.vdot(km, sec) * 10) / 10;
  if (vd < 20 || vd > 85) return toast('Das Ergebnis wirkt unplausibel. Prüfe Strecke und Zeit.');
  const rec = { metric: 'vdot_current', value: vd, unit: 'VDOT', achieved_date: S.today, source: 'Takt', confidence: 'calculated', notes: `Testlauf ${N(km)} km in ${T.mmss(sec)}.` };
  if (!saved(await upsert('personal_records', rec, 'metric'))) return;
  S.prs = S.prs.filter(p => p.metric !== 'vdot_current').concat(rec); derive(); closeSheet(); renderVerlauf(); toast(`VDOT ${N(vd)}: 5 km in ${T.mmss(T.raceTime(vd, 5))}`);
}

/* ================================================================
   MEHR
================================================================ */
function renderMehr() {
  const p = S.profile || {}, pr = S.pr, val = (m, d = 0) => pr[m] ? N(pr[m].value, d) : '–';
  $('v-mehr').innerHTML = `
    <div class="card"><h2>Bestwerte</h2><dl class="kv">
      <dt>Bankdrücken (Max)</dt><dd>${val('bench_1rm_kg', pr.bench_1rm_kg && pr.bench_1rm_kg.value % 1 ? 1 : 0)} kg</dd>
      <dt>Kreuzheben (Max)</dt><dd>${val('dl_1rm_kg', pr.dl_1rm_kg && pr.dl_1rm_kg.value % 1 ? 1 : 0)} kg</dd>
      <dt>FTP</dt><dd>${val('ftp_watt')} W</dd>
      <dt>10 km</dt><dd>${pr.run_10k_time ? T.mmss(pr.run_10k_time.value) : '–'}</dd>
      <dt>Sprint 5 s</dt><dd>${val('sprint_5s_watt')} W</dd></dl>
      <button class="btn full" style="margin-top:14px" onclick="openPrs()">Bestwerte ändern</button></div>
    <div class="card"><h2>Pulszonen</h2><dl class="kv">
      <dt>Rad locker (Z1)</dt><dd>bis ${p.z1_hi ?? 143}</dd><dt>Rad Grundlage (Z2)</dt><dd>${p.z2_lo ?? 144}–${p.z2_hi ?? 162}</dd>
      <dt>Rad Sweetspot</dt><dd>${p.ss_lo ?? 164}–${p.ss_hi ?? 173}</dd><dt>Rad VO2max</dt><dd>ab ${p.vo2_lo ?? 178}</dd>
      <dt>Lauf locker (Sehne)</dt><dd>bis 148</dd><dt>Lauf Grundlage</dt><dd>149–167</dd></dl></div>
    <div class="card"><h2>Ziele</h2>${S.goals.map(g => `<button class="pick" onclick="openGoalAct(${g.id})">${esc(g.title)}<span>${g.status === 'active' ? 'aktiv' : g.status === 'done' ? 'erreicht' : 'beendet'}${g.target_date ? ', bis ' + T.dayY(g.target_date) : ''}</span></button>`).join('')}
      <button class="btn full" style="margin-top:14px" onclick="openGoal()">Neues Ziel</button></div>
    <div class="card"><h2>So entscheidet Takt</h2><ul class="rules">
      <li>Readiness = 70 + 1,5 × (HRV − dein Langzeitmittel) + 0,5 × (HRV − Schnitt der letzten 4 Wochen) − 2 × (Ruhepuls − Schnitt der Vorwoche) + 2 × (Schlaf − 7 h, höchstens 7,5 h zählen).</li>
      <li>Ab 70: wie geplant. 55 bis 69: harte Einheiten und Kraft dosieren, Tests verschieben. Unter 55: Hartes verschieben, unter 45 lieber frei.</li>
      <li>Immer höchstens „dosiert“ bei: weniger als 6 h Schlaf, Ruhepuls 5 über der Vorwoche, HRV drei Tage fallend, Form unter −20, zwei harten Tagen in Folge oder Gefühl „platt“.</li>
      <li>Achillessehne steif: keine Lauf-Intensität. Zieht sie: Rad statt Lauf.</li>
      <li>Intervalle wertet Takt aus den Runden deiner Uhr aus: Alle Abschnitte in der Zielpace (3 s Toleranz) gelten als geschafft. Zweimal klar schneller bei Puls bis 170: Vorschlag, die Pace um 5 s anzuziehen.</li>
      <li>Ziele rechnet Takt gegen deinen Trend. Beim Lauf gilt die Annahme +0,15 VDOT pro Woche, beim Gewicht dein Trend der letzten drei Wochen.</li>
      <li>Am Sonntag gibt es genau eine Entscheidung: entlasten bei zwei verfehlten Einheiten oder bei mehr Belastung und fallender HRV, sonst weiter wie geplant.</li>
      <li>Verfehlt: einmal wiederholen, zweimal in Folge leichter (Kraft −5 %, Lauf +5 s/km), dreimal Deload.</li>
      <li>Die Formel ist an deinen Check-ins seit Juni geeicht und trifft in vier von fünf Fällen dieselbe Stufe wie die bisherigen Urteile.</li></ul></div>
    <div class="card"><h2>Daten</h2><p class="sm mute" style="margin-bottom:12px">Takt braucht keine KI. Wenn du etwas mit Claude besprechen willst, kopiert „Lagebild“ den aktuellen Stand als kurzen Text in die Zwischenablage.</p>
      <div class="row"><button class="btn" onclick="copyBrief()">Lagebild kopieren</button><button class="btn" onclick="backup()">Sicherung laden</button></div>
      <details class="more" style="margin-top:8px"><summary>Verbindung</summary><div class="f">
        <label for="cfUrl">Supabase-Adresse</label><input id="cfUrl" value="${esc(CFG.url)}" style="font-size:14px">
        <div class="f-row"><label for="cfKey">Schlüssel (anon)</label><input id="cfKey" value="${esc(CFG.key)}" style="font-size:14px"></div>
        <div class="f-row"><button class="btn" onclick="saveCfg()">Speichern und neu laden</button></div></div></details></div>`;
}
function openPrs() {
  const f = (id, l, m) => `<div><label for="${id}">${l}</label><input class="big" id="${id}" inputmode="decimal" value="${S.pr[m] ? String(S.pr[m].value).replace('.', ',') : ''}"></div>`;
  sheet(`<h3>Bestwerte</h3><div class="sub">Das Max ist der Anker für den nächsten Kraftzyklus.</div><div class="f"><div class="f-grid">${f('prB', 'Bankdrücken (kg)', 'bench_1rm_kg')}${f('prD', 'Kreuzheben (kg)', 'dl_1rm_kg')}${f('prF', 'FTP (W)', 'ftp_watt')}</div>
    <div class="f-row row"><button class="btn pri" onclick="savePrs()">Speichern</button><button class="btn" onclick="closeSheet()">Abbrechen</button></div></div>`);
}
async function savePrs() {
  let ok = true;
  for (const [id, metric, unit] of [['prB', 'bench_1rm_kg', 'kg'], ['prD', 'dl_1rm_kg', 'kg'], ['prF', 'ftp_watt', 'W']]) {
    const v = parseFloat(($(id).value || '').replace(',', '.'));
    if (!v || (S.pr[metric] && +S.pr[metric].value === v)) continue;
    const rec = { metric, value: v, unit, achieved_date: S.today, source: 'Takt', confidence: 'confirmed' };
    ok = (await upsert('personal_records', rec, 'metric')) && ok;
    S.prs = S.prs.filter(p => p.metric !== metric).concat({ ...(S.pr[metric] || {}), ...rec });
  }
  if (!saved(ok)) return; derive(); closeSheet(); renderAll(); toast('Bestwerte gespeichert');
}
function openGoalAct(id) {
  const g = S.goals.find(x => x.id === id);
  sheet(`<h3>${esc(g.title)}</h3><div class="sub">${esc(g.target_value || '')}${g.target_date ? ', bis ' + T.dayY(g.target_date) : ''}</div><div class="row">${g.status === 'active' ? `<button class="btn pri" onclick="setGoal(${id},'done')">Erreicht</button><button class="btn" onclick="setGoal(${id},'dropped')">Beenden</button>` : `<button class="btn" onclick="setGoal(${id},'active')">Wieder aktivieren</button>`}</div>`);
}
async function setGoal(id, status) { if (!saved(await patch('athlete_goals', `id=eq.${id}`, { status }))) return; S.goals.find(g => g.id === id).status = status; closeSheet(); renderAll(); toast('Ziel aktualisiert'); }
function openGoal() {
  sheet(`<h3>Neues Ziel</h3><div class="f"><label for="glT">Ziel</label><input id="glT" placeholder="z. B. 10 km unter 45 Minuten">
    <div class="f-row"><span class="flabel">Art</span>${segHtml('glK', [['race_run', 'Lauf'], ['race_bike', 'Rad'], ['strength', 'Kraft'], ['weight', 'Gewicht']], 'race_run')}</div>
    <div class="f-row"><label for="glV">Zielwert</label><input id="glV" placeholder="z. B. 45:00 oder 130 kg"></div>
    <div class="f-row"><label for="glD">Termin</label><input id="glD" type="date"></div>
    <div class="f-row row"><button class="btn pri" onclick="saveGoal()">Anlegen</button><button class="btn" onclick="closeSheet()">Abbrechen</button></div></div>`);
}
async function saveGoal() {
  const title = $('glT').value.trim(); if (!title) return toast('Das Ziel braucht einen Namen.');
  if (!saved(await insert('athlete_goals', { title, goal_type: segVal('glK') || 'custom', target_value: $('glV').value.trim() || null, target_date: $('glD').value || null, priority: 'B', status: 'active' }))) return;
  closeSheet(); toast('Ziel angelegt'); loadAll();
}
function brief() {
  const c = S.ci, b = S.base, L = S.load[S.load.length - 1] || {}, wg = weightGoal(), w = T.weight(S.ck, S.today, wg ? parseFloat(wg.target_value) : null, wg && wg.target_date);
  const wk = [...Array(7)].map((_, i) => T.add(T.monday(S.today), i)).map(d => { const p = rowOn(d), st = dayStatus(p, d); return `${T.day(d)} ${p ? p.main_text : '–'}${st ? ' (' + st[1] + ')' : ''}`; });
  return [`TAKT-Lagebild ${T.dayLong(S.today)} ${S.today.slice(0, 4)}`,
    c ? `Readiness ${S.rd.score} (${S.rd.label}), Urteil: ${S.v.word}. HRV ${c.hrv_ms} (Ø7 ${N(b.hrv7, 0)}, Ø28 ${N(b.hrv28, 0)}), Ruhepuls ${c.resting_hr ?? '–'} (Ø7 ${N(b.rhr7, 0)}), Schlaf ${N(c.sleep_hours)} h${c.achilles ? ', Achilles ' + c.achilles : ''}.` : 'Heute noch kein Check-in.',
    `HRV letzte 7 Tage: ${S.ck.slice(-7).map(x => x.hrv_ms).join(', ')}`,
    w ? `Gewicht: Ø7 ${N(w.now)} kg, Trend ${N(w.perWeek, 2)} kg/Woche${w.target ? `, Ziel ${N(w.target, 0)} kg bis ${w.targetDate}` : ''}.` : '',
    `Belastung: Fitness ${N(L.ctl, 0)}, Ermüdung ${N(L.atl, 0)}, Form ${N(L.ctl - L.atl, 0)}.`,
    `Woche:\n${wk.join('\n')}`,
    `Letzte Einheiten:\n${S.wo.filter(x => T.wKind(x) !== 'ebike').slice(-6).map(x => `${T.day(x.workout_date)} ${x.name}: ${x.duration_min} min${x.distance_km > 0 ? ', ' + N(x.distance_km) + ' km' : ''}${x.avg_hr ? ', Ø-Puls ' + x.avg_hr : ''}, TSS ${x.tss ?? '–'}`).join('\n')}`,
    `Ziele: ${S.goals.filter(g => g.status === 'active').map(g => `${g.title}${g.target_date ? ' (' + g.target_date + ')' : ''}`).join('; ')}`,
    `Bestwerte: Bank ${(S.pr.bench_1rm_kg || {}).value ?? '–'} kg, Kreuzheben ${(S.pr.dl_1rm_kg || {}).value ?? '–'} kg, VDOT ${(vdotNow() || {}).value ?? '–'}.`].filter(Boolean).join('\n');
}
async function copyBrief() {
  const t = brief();
  try { await navigator.clipboard.writeText(t); toast('Lagebild kopiert'); }
  catch (e) { sheet(`<h3>Lagebild</h3><div class="sub">Markieren und kopieren:</div><div class="f"><textarea style="min-height:300px" readonly>${esc(t)}</textarea></div>`); }
}
function backup() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ exported: new Date().toISOString(), checkins: S.ck, plan: S.plan, workouts: S.wo, goals: S.goals, records: S.prs, nutrition_plan: S.nplan, nutrition_log: S.nlog }, null, 1)], { type: 'application/json' }));
  a.download = `takt-sicherung-${S.today}.json`; a.click(); toast('Sicherung gespeichert');
}
function saveCfg() { localStorage.setItem('takt_url', $('cfUrl').value.trim()); localStorage.setItem('takt_key', $('cfKey').value.trim()); location.reload(); }

/* ---------- Start ---------- */
let rsz; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if (S.view === 'verlauf') drawCharts(); }, 200); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && (T.iso(new Date()) !== S.today || Date.now() - (S.stamp || 0) > 15 * 60000)) loadAll(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
loadAll();
</script>
